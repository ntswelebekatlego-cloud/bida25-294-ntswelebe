<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chrome Hearts | Botswana Atelier — Bright Edition</title>
    <!-- Google Fonts: elegant serif + clean sans for bright & airy feel -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Leaflet CSS (bright map friendly) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fef7ed;  /* warm bright base (fallback) */
            color: #2c1b1b;
            line-height: 1.45;
            scroll-behavior: smooth;
        }

        /* ===== BRIGHT BACKGROUND SLIDESHOW (luminous & soft) ===== */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }
        .bg-slideshow .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center 30%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            /* bright effect: light filter, no dark crushing */
            filter: brightness(0.98) contrast(1.02);
        }
        .bg-slideshow .bg-slide.active {
            opacity: 1;
        }
        /* soft radial veil — light & airy to keep brightness */
        .bg-slideshow::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 20%, rgba(255,245,235,0.45), rgba(255,250,240,0.3));
            pointer-events: none;
            z-index: 1;
        }

        /* main content wrapper - bright cards with crystal transparency */
        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem 2rem 3rem;
        }

        /* all cards: bright white/cream glassmorphism, fresh and luminous */
        .top-bar, .map-card, .details-card, .extra-tile, .hero, .footer {
            background: rgba(255, 253, 250, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0,0,0,0.02);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 0.9rem 1.8rem;
            border: 1px solid rgba(210, 140, 120, 0.5);
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-box img {
            max-height: 56px;
            width: auto;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.08));
        }
        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 1.45rem;
            letter-spacing: 2px;
            color: #9e3c2c;
            border-left: 2px solid #c77a5a;
            padding-left: 12px;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #3e2828;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.4px;
            transition: 0.2s;
            font-size: 0.95rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            padding: 4px 0;
        }
        .nav-links a:hover {
            color: #c95b3e;
            border-bottom-color: #ce7a5e;
        }

        /* searchbar - bright stylish */
        .search-container {
            display: flex;
            align-items: center;
            background: #fffbf5;
            border-radius: 60px;
            padding: 5px 12px;
            gap: 8px;
            border: 1px solid #ddafa0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .search-container input {
            background: transparent;
            border: none;
            padding: 8px 6px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            min-width: 180px;
            outline: none;
            color: #3b2a2a;
        }
        .search-container input::placeholder {
            color: #b78272;
            font-weight: 400;
        }
        .search-container button {
            background: #ce6b50;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .search-container button:hover {
            background: #b14e34;
        }

        .hero {
            text-align: center;
            margin: 1.2rem 0 2rem;
            padding: 2rem 1rem;
            border: 1px solid #e1bcae;
        }
        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #402424;
            text-shadow: 0 1px 2px rgba(255,245,230,0.9);
        }
        .hero p {
            font-size: 1.1rem;
            color: #6c4640;
            font-weight: 500;
        }

        .location-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin: 2rem 0;
        }
        .map-card {
            flex: 2;
            min-width: 280px;
            padding: 1rem;
            border: 1px solid #dcaa97;
        }
        .details-card {
            flex: 1.2;
            padding: 1.8rem;
            border: 1px solid #dcaa97;
        }
        .details-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            border-left: 5px solid #ce6b50;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
            color: #3a2626;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.3rem;
            font-size: 0.95rem;
            color: #4d3630;
        }
        .info-row i {
            width: 32px;
            font-size: 1.3rem;
            color: #ce6b50;
        }
        .gothic-badge {
            background: #f5e6dfcc;
            border-radius: 60px;
            padding: 8px 18px;
            display: inline-block;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
            color: #7e4236;
        }

        .extras-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .extra-tile {
            flex: 1;
            padding: 1.4rem;
            text-align: center;
            border: 1px solid #e2bcab;
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
            background: rgba(255, 252, 248, 0.94);
        }
        .extra-tile:hover {
            transform: translateY(-5px);
            border-color: #ce6b50;
            background: rgba(255, 248, 240, 0.98);
        }
        .extra-tile i {
            font-size: 2.3rem;
            color: #ce6b50;
            margin-bottom: 0.8rem;
        }

        /* bright map container */
        #chromeMap {
            height: 420px;
            width: 100%;
            border-radius: 28px;
            border: 2px solid #dc9a83;
            background: #fff3ea;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .footer {
            margin-top: 3rem;
            padding: 1.2rem 1.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #4b3430;
            border: 1px solid #e1bcae;
        }
        .footer-links {
            display: flex;
            gap: 2rem;
        }
        .footer-links span {
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .footer-links span:hover {
            color: #ce6b50;
        }

        /* MODAL bright & clean */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(30, 20, 18, 0.5);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fffef9;
            max-width: 480px;
            width: 90%;
            border-radius: 40px;
            padding: 2rem;
            border: 2px solid #ce6b50;
            text-align: center;
            color: #2d1f1c;
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
        }
        .modal-content h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }
        .close-modal {
            background: #ce6b50;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-top: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 780px) {
            .wrapper { padding: 1rem; }
            .hero h1 { font-size: 1.8rem; }
            .top-bar { flex-direction: column; gap: 12px; }
            .nav-links { justify-content: center; }
        }
    </style>
</head>

    // ---------- RENDER engine with map initialization for location view ----------
    function renderView(view) {
        let contentHTML = "";
        if (view === "home") {
            contentHTML = getHomeHTML();
            heroTitle.innerText = "⚜️ CHROME HEARTS • LUMINOUS GOTHIC ⚜️";
            heroSub.innerText = "Rebellion meets light • handcrafted elegance in Botswana";
        } else if (view === "about") {
            contentHTML = getAboutHTML();
            heroTitle.innerText = "THE LEGACY • SINCE 1988 • BRIGHT REBELLION";
            heroSub.innerText = "Richard Stark's vision of radiant high-end craftsmanship";
        } else if (view === "products") {
            contentHTML = getProductsHTML();
            heroTitle.innerText = "SILVER, LEATHER & ETERNAL FLAME";
            heroSub.innerText = "Discover iconoclast collections under African light";
        } else if (view === "contact") {
            contentHTML = getContactHTML();
            heroTitle.innerText = "CONNECT WITH RADICAL ELEGANCE";
            heroSub.innerText = "Private consultations & global inquiries";
        } else {  // location (default)
            contentHTML = getLocationHTML();
            heroTitle.innerText = "CHROME HEARTS • BOTSWANA FLAGSHIP • BRIGHT ATELIER";
            heroSub.innerText = "Plot 179, Gaborone International Commerce Park — open daily";
        }
        dynamicContainer.innerHTML = contentHTML;
        currentView = view;

        if (view === "location") {
            setTimeout(() => {
                if (chromeMap) {
                    chromeMap.remove();
                    chromeMap = null;
                }
                const mapDiv = document.getElementById('chromeMap');
                if (mapDiv) {
                    // LIGHT & BRIGHT MAP TILE (CartoDB Voyager / light)
                    chromeMap = L.map('chromeMap').setView([-24.6282, 25.9231], 15);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB',
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(chromeMap);
                    // custom bright marker (sunny / gothic cross)
                    const brightIcon = L.divIcon({
                        html: '<i class="fas fa-sun" style="font-size: 30px; color: #e0886a; text-shadow: 0 0 4px white;"></i>',
                        iconSize: [32, 32],
                        className: 'bright-marker'
                    });
                    const marker = L.marker([-24.6282, 25.9231], { icon: brightIcon }).addTo(chromeMap);
                    marker.bindPopup('<b>⚜️ CHROME HEARTS BOTSWANA ⚜️</b><br>Plot 179, Gaborone Int. Commerce Park<br>✨ Bright flagship open now').openPopup();
                    L.circle([-24.6282, 25.9231], { radius: 220, color: '#ce6b50', weight: 2, fillOpacity: 0.12, fillColor: '#fadbcb' }).addTo(chromeMap);
                }
            }, 80);
        } else {
            if (chromeMap) { chromeMap.remove(); chromeMap = null; }
        }
        attachExtraTileEvents();
    }

    function attachExtraTileEvents() {
        const amenities = document.getElementById('amenitiesTile');
        const transport = document.getElementById('transportTile');
        const designer = document.getElementById('designerTile');
        if (amenities) amenities.addEventListener('click', () => showPopup('BOUTIQUE AMENITIES', 'Bright fitting suites, silver engraving bar, champagne lounge & natural light VIP area.'));
        if (transport) transport.addEventListener('click', () => showPopup('TRANSPORT & ACCESS', 'Free parking (70 spaces), wheelchair access, VIP shuttle from Hilton & Cresta hotels. Airport 12 min.'));
        if (designer) designer.addEventListener('click', () => showPopup('DESIGNER ATELIER', 'On-site silversmith consultations. Custom orders for rings & leather. Appointment required.'));
        const allTiles = document.querySelectorAll('.extra-tile');
        allTiles.forEach(tile => {
            if (!tile.id) {
                tile.addEventListener('click', () => showPopup('✦ EXTRA INSIGHT ✦', tile.querySelector('h4')?.innerText + ': ' + tile.querySelector('p')?.innerText));
            }
        });
    }

    // Modal handling
    const modal = document.getElementById('infoModal');
    const modalTitleElem = document.getElementById('modalTitle');
    const modalTextElem = document.getElementById('modalText');
    const closeModalBtn = document.getElementById('closeModalBtn');
    function showPopup(title, message) {
        modalTitleElem.innerText = title;
        modalTextElem.innerText = message;
        modal.style.display = 'flex';
    }
    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    // footer legal popups
    document.getElementById('copyrightModalBtn').addEventListener('click', () => showPopup('COPYRIGHT DETAILS', '© Chrome Hearts & Botswana Atelier. All creative assets, brand identity and designs are protected. All rights reserved.'));
    document.getElementById('legalModalBtn').addEventListener('click', () => showPopup('LEGAL INFORMATION', 'Terms of use apply. Chrome Hearts Botswana holds official license. Final sale on limited collections.'));
    document.getElementById('privacyModalBtn').addEventListener('click', () => showPopup('PRIVACY POLICY', 'Your data is used solely for inquiries & newsletters. GDPR compliant. We do not share with third parties.'));

    // navigation binding
    document.getElementById('navHomeBtn').addEventListener('click', () => renderView('home'));
    document.getElementById('navAboutBtn').addEventListener('click', () => renderView('about'));
    document.getElementById('navProductsBtn').addEventListener('click', () => renderView('products'));
    document.getElementById('navContactBtn').addEventListener('click', () => renderView('contact'));
    document.getElementById('navLocationBtn').addEventListener('click', () => renderView('location'));

    // SEARCH functionality (bright & interactive)
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchBtn');
    function performSearch() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
            showPopup("🔍 SEARCH", "Enter keyword: rings, silver, location, hoodie, atelier, leather...");
            return;
        }
        const pageText = document.body.innerText.toLowerCase();
        if (pageText.includes(query)) {
            showPopup("🔍 RESULTS FOUND", `Matches for "${query}" found on this page. Visit our products or contact boutique for details.`);
        } else {
            showPopup("🔍 NO DIRECT MATCH", `No direct match for "${query}". Try 'silver', 'Gaborone', 'leather' or browse our collections.`);
        }
    }
    searchButton.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });

    // initial render: location + interactive map
    renderView('location');
</script>
